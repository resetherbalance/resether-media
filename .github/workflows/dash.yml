name: Dashboard data

on:
  push:
    paths: ['dash.py', 'dashboard/manual/**', 'schedule.json']
  workflow_dispatch:
  workflow_run:
    workflows: ['Learning loop research']
    types: [completed]
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dashboard data
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python dash.py
      - name: Save
        run: |
          git config user.name "ResetHer Publisher"
          git config user.email "resetherbalance@gmail.com"
          git add dashboard
          git diff --cached --quiet || (git commit -m "Dashboard data" && git pull --rebase -X theirs && git push)
