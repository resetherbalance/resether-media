name: Trial Reels check
on:
  push:
    paths: ['research/trial_check.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python research/trial_check.py
      - run: |
          git config user.name "ResetHer Publisher"
          git config user.email "resetherbalance@gmail.com"
          git add research
          git diff --cached --quiet || (git commit -m "Trial check result" && git pull --rebase && git push)
